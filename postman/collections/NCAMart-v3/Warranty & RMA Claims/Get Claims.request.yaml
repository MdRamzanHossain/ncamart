$kind: http-request
description: |
  Handles **GET** requests on `/api/v1/rma/claims`.

  - **Authentication:** ANY
  - **Source File:** `src/app/api/v1/rma/claims/route.ts`
url: "{{baseUrl}}/api/v1/rma/claims"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: nca_sid={{sessionToken}}
    description: Session authentication cookie
order: 1000
